plugins {
    id 'fabric-loom' version '1.14-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base { archivesName = project.archives_base_name }

repositories {
    // Modrinth maven: used to pull the optimization mods that get bundled (jar-in-jar) into Aqua Client.
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // ---- Bundled performance mods (unmodified, nested inside the Aqua jar) ----
    // Sodium 0.8.13 (rendering engine)            - Modrinth project AANobbMI
    modImplementation "maven.modrinth:AANobbMI:Ny3XyYle"
    include           "maven.modrinth:AANobbMI:Ny3XyYle"
    // Lithium 0.21.2 (game logic / AI / physics)   - Modrinth project gvQqBUqZ
    modImplementation "maven.modrinth:gvQqBUqZ:gl30uZvp"
    include           "maven.modrinth:gvQqBUqZ:gl30uZvp"
    // ImmediatelyFast 1.14.1 (HUD / immediate-mode rendering) - Modrinth project 5ZwdcRci
    modImplementation "maven.modrinth:5ZwdcRci:XCnavm6o"
    include           "maven.modrinth:5ZwdcRci:XCnavm6o"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 21 }

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
